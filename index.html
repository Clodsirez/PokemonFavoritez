<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mural de Favoritos Pokémon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap');

:root{
  --bg:#1B1526;
  --panel:#241B33;
  --panel-2:#2C2140;
  --line:#3A2E52;
  --ink:#F5F0FF;
  --muted:#A99CC7;
  --accent:#E63946;
  --accent-2:#F4C542;
  --good:#3ABE8E;

  /* tamanho médio (padrão) */
  --slot-size:64px;
  --sprite-size:52px;
  --type-font:11.5px;
  --type-minw:74px;
  --gen-font:12px;
  --gen-sub-font:9.5px;
  --cat-title-font:12.5px;
  --cat-title-minh:32px;
  --team-slot-size:68px;
  --team-sprite-size:56px;
  --team-title-font:15px;
  --tile-col-min:62px;
  --tile-sprite-size:40px;
  --tile-font:8.5px;
  --grid-gap:6px;
  --cat-gap:14px;
  --tag-font:8.5px;
  --cat-card-width:150px;
  --team-card-width:300px;
}
body[data-size="small"]{
  --slot-size:50px;
  --sprite-size:40px;
  --type-font:9.5px;
  --type-minw:58px;
  --gen-font:10px;
  --gen-sub-font:8px;
  --cat-title-font:10.5px;
  --cat-title-minh:26px;
  --team-slot-size:54px;
  --team-sprite-size:44px;
  --team-title-font:12.5px;
  --tile-col-min:50px;
  --tile-sprite-size:32px;
  --tile-font:7.5px;
  --grid-gap:4px;
  --cat-gap:10px;
  --tag-font:7.5px;
  --cat-card-width:120px;
  --team-card-width:230px;
}
body[data-size="large"]{
  --slot-size:100px;
  --sprite-size:84px;
  --type-font:17px;
  --type-minw:110px;
  --gen-font:17px;
  --gen-sub-font:13px;
  --cat-title-font:16px;
  --cat-title-minh:42px;
  --team-slot-size:104px;
  --team-sprite-size:88px;
  --team-title-font:19px;
  --tile-col-min:92px;
  --tile-sprite-size:62px;
  --tile-font:13px;
  --grid-gap:9px;
  --cat-gap:18px;
  --tag-font:12px;
  --cat-card-width:190px;
  --team-card-width:420px;
}
body[data-size="giant"]{
  --slot-size:152px;
  --sprite-size:130px;
  --type-font:22px;
  --type-minw:172px;
  --gen-font:22px;
  --gen-sub-font:16px;
  --cat-title-font:21px;
  --cat-title-minh:58px;
  --team-slot-size:158px;
  --team-sprite-size:136px;
  --team-title-font:26px;
  --tile-col-min:130px;
  --tile-sprite-size:88px;
  --tile-font:16px;
  --grid-gap:13px;
  --cat-gap:24px;
  --tag-font:15px;
  --cat-card-width:260px;
  --team-card-width:560px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 600px at 15% -10%, #2E2246 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #24314A 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif;
  min-height:100vh;
  padding:28px 20px 60px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001s !important; transition-duration:0.001s !important;}
}

.wrap{max-width:1500px;margin:0 auto;}

/* ---------- Header ---------- */
.header{
  display:flex;align-items:center;gap:18px;
  margin-bottom:22px;
  padding:16px 22px;
  background:linear-gradient(135deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);
  border-radius:18px;
  position:relative;
  overflow:hidden;
}
.header::before{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(120px 120px at -20px -30px, rgba(230,57,70,0.35), transparent 70%);
  pointer-events:none;
}
.dex-light{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #7fe8ff, #2b9fd8 55%, #1b6ea3 100%);
  box-shadow:0 0 0 4px rgba(255,255,255,0.08), 0 0 18px rgba(66,180,255,0.6);
  flex:0 0 auto;
}
.header h1{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:26px;
  margin:0;
  letter-spacing:0.3px;
}
.header p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13.5px;
}
.header-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;}
.btn{
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:13px;
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--ink);
  cursor:pointer;
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{transform:translateY(-1px); border-color:var(--accent-2);}
.btn:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px;}
.btn.danger{border-color:rgba(230,57,70,0.5);}
.btn.danger:hover{background:rgba(230,57,70,0.15);}
.btn:disabled{opacity:0.6; cursor:default; transform:none;}

.progress-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  color:var(--accent-2);
  background:rgba(244,197,66,0.08);
  border:1px solid rgba(244,197,66,0.35);
  padding:8px 14px;
  border-radius:999px;
  white-space:nowrap;
}

.size-switch{
  display:flex; gap:2px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
}
.size-btn{
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:13px;
  min-width:32px;height:32px;
  padding:0 8px;
  border-radius:999px;
  border:none;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.size-btn:hover{color:var(--ink);}
.size-btn:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px;}
.size-btn[aria-pressed="true"]{
  background:var(--accent-2);
  color:#1c1424;
}

/* ---------- Section labels ---------- */
.section-label{
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:15px;
  color:var(--accent-2);
  margin:30px 4px 12px;
  display:flex; align-items:center; gap:10px;
}
.section-label::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg, var(--line), transparent);
}

/* ---------- Main grid ---------- */
.grid-scroll{
  overflow-x:auto;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel);
  padding-bottom:4px;
}
table.gridtable{
  border-collapse:separate;
  border-spacing:var(--grid-gap);
  padding:10px;
}
.corner-cell{
  position:sticky; left:0; top:0; z-index:5;
  background:var(--panel);
}
th.type-head{
  position:sticky; top:0; z-index:3;
  min-width:var(--type-minw);
  font-family:'Baloo 2',sans-serif;
  font-size:var(--type-font);
  font-weight:700;
  color:#1c1424;
  padding:9px 4px;
  border-radius:10px;
  text-align:center;
  letter-spacing:0.2px;
  text-shadow:0 1px 0 rgba(255,255,255,0.25);
}
th.gen-head{
  position:sticky; left:0; z-index:4;
  background:var(--panel-2);
  border-radius:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:var(--gen-font);
  color:var(--accent-2);
  padding:0 12px;
  text-align:center;
  white-space:nowrap;
}

.slot{
  width:var(--slot-size);height:var(--slot-size);
  border-radius:12px;
  background:var(--panel-2);
  border:1.5px dashed var(--line);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  padding:0;
}
.slot:hover{transform:translateY(-2px) scale(1.05); border-color:var(--accent-2); z-index:2;}
.slot:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px;}
.slot.filled{border-style:solid; border-color:transparent; background:radial-gradient(circle at 50% 40%, #3a2e52, #241b33 75%);}
.slot img{width:var(--sprite-size);height:var(--sprite-size);image-rendering:auto;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));}
.slot .ball-icon{width:22px;height:22px;border-radius:50%;
  background:linear-gradient(180deg,var(--accent) 0 48%, #efe9f7 48% 52%, #efe9f7 52% 56%, var(--panel) 56% 100%);
  border:2px solid #efe9f7;
  opacity:0.55;
}
.type-chip{
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',sans-serif; font-weight:800;
  color:#1c1424;
  text-shadow:0 1px 0 rgba(255,255,255,0.25);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,0.12);
}
.slot .clear-x{
  position:absolute; top:-6px; right:-6px;
  width:18px;height:18px;border-radius:50%;
  background:var(--accent); color:#fff;
  font-size:11px; line-height:18px; text-align:center;
  border:none; cursor:pointer; opacity:0; transition:opacity .12s ease;
  font-weight:800;
}
.slot:hover .clear-x{opacity:1;}

.slot-wrap{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.slot-label{
  display:block;
  font-size:var(--tag-font);
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  text-align:center;
  line-height:1.15;
  min-height:1.15em;
  max-width:calc(var(--slot-size) + 26px);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.slot-label.has-name{color:var(--accent-2);}

/* ---------- Category / bottom section ---------- */
.cat-grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:var(--cat-gap);
}
.cat-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 10px 14px;
  text-align:center;
  transition:border-color .15s ease, transform .15s ease, flex-basis .15s ease;
  flex:0 1 var(--cat-card-width);
  max-width:var(--cat-card-width);
}
.cat-card:hover{border-color:var(--accent-2); transform:translateY(-2px);}
.cat-card h3{
  font-family:'Baloo 2',sans-serif;
  font-size:var(--cat-title-font);
  font-weight:700;
  margin:0 0 10px;
  min-height:var(--cat-title-minh);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);
  line-height:1.25;
}
.cat-card .slot-wrap{margin:0 auto;}
table.gridtable td{text-align:center;}

.team-card{
  background:var(--panel);
  border:1.5px solid rgba(244,197,66,0.35);
  border-radius:14px;
  padding:16px;
  text-align:center;
  flex:0 1 var(--team-card-width);
  max-width:var(--team-card-width);
  transition:flex-basis .15s ease;
}
.team-card h3{
  font-family:'Baloo 2',sans-serif; font-size:var(--team-title-font); margin:0 0 12px; color:var(--accent-2);
}
.team-rows{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; justify-items:center;}
.team-rows .slot{width:var(--team-slot-size);height:var(--team-slot-size);}
.team-rows .slot img{width:var(--team-sprite-size);height:var(--team-sprite-size);}

@media (max-width: 480px){
  .cat-card, .team-card{ flex:1 1 100%; max-width:420px; }
}

/* ---------- Search overlay ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(10,7,17,0.72);
  display:flex; align-items:center; justify-content:center;
  z-index:50; padding:20px;
  backdrop-filter:blur(2px);
}
.search-box{
  width:100%; max-width:640px;
  max-height:86vh;
  display:flex; flex-direction:column;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.search-box .slot-title{
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
  color:var(--accent-2); margin-bottom:4px;
}
.range-note{
  font-size:11px; color:var(--muted); margin-bottom:8px;
  background:rgba(244,197,66,0.07); border:1px solid rgba(244,197,66,0.25);
  padding:5px 10px; border-radius:8px; display:inline-block;
}
.range-note:empty{display:none; margin-bottom:0;}
.search-box input{
  width:100%; padding:10px 14px; border-radius:999px;
  border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
  font-family:'Nunito',sans-serif; font-size:14px; outline:none;
  flex:0 0 auto;
}
.search-box input:focus{border-color:var(--accent-2);}
.result-count{
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
  margin:8px 2px 4px;
}
.results{
  overflow-y:auto; margin-top:2px;
  flex:1 1 auto;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(var(--tile-col-min), 1fr));
  gap:6px;
  padding:4px 2px;
}
.result-tile{
  display:flex; flex-direction:column; align-items:center;
  gap:2px; padding:6px 2px 5px;
  border-radius:10px; cursor:pointer;
  background:var(--panel-2);
  border:1px solid transparent;
  transition:border-color .1s ease, transform .1s ease;
}
.result-tile:hover{border-color:var(--accent-2); transform:translateY(-2px);}
.result-tile:focus-visible{outline:2px solid var(--accent-2); outline-offset:1px;}
.result-tile img{width:var(--tile-sprite-size);height:var(--tile-sprite-size);image-rendering:auto;object-fit:contain;}
.result-tile .dexno{font-family:'JetBrains Mono',monospace; font-size:var(--tile-font); color:var(--muted);}
.result-tile .tname{
  font-size:var(--tile-font); color:var(--ink); text-align:center; line-height:1.1;
  max-width:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.close-row{display:flex; justify-content:flex-end; margin-top:10px; flex:0 0 auto;}
.no-results{color:var(--muted); font-size:12.5px; padding:10px 4px; grid-column:1/-1;}

.hint{color:var(--muted); font-size:12px; margin-top:16px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="dex-light"></div>
    <div>
      <h1>Mural de Favoritos Pokémon</h1>
      <p>Clique em qualquer espaço vazio e procure o Pokémon pra encaixar ali.</p>
    </div>
    <div class="header-actions">
      <div class="size-switch" role="group" aria-label="Tamanho das cartas e imagens">
        <button class="size-btn" data-size="small" title="Pequeno" aria-pressed="false">P</button>
        <button class="size-btn" data-size="medium" title="Médio" aria-pressed="true">M</button>
        <button class="size-btn" data-size="large" title="Grande" aria-pressed="false">G</button>
        <button class="size-btn" data-size="giant" title="Gigante" aria-pressed="false">GG</button>
      </div>
      <span class="progress-pill" id="progressPill">0 / 0 preenchidos</span>
      <button class="btn" id="exportBtn">📸 Salvar imagem</button>
      <button class="btn danger" id="resetBtn">Limpar tudo</button>
    </div>
  </div>

  <div class="section-label">Tipos x Gerações</div>
  <div class="grid-scroll">
    <table class="gridtable" id="mainGrid"></table>
  </div>

  <div class="section-label">Categorias especiais</div>
  <div id="catArea"></div>

  <div class="hint">Seus favoritos ficam salvos automaticamente neste navegador.</div>
</div>

<div class="overlay" id="overlay" style="display:none;">
  <div class="search-box">
    <div class="slot-title" id="overlayTitle">Escolher Pokémon</div>
    <div class="range-note" id="rangeNote"></div>
    <input type="text" id="searchInput" placeholder="Digite o nome (ex: Pikachu) ou role a lista abaixo" autocomplete="off">
    <div class="result-count" id="resultCount"></div>
    <div class="results" id="resultsList"></div>
    <div class="close-row"><button class="btn" id="closeOverlay">Fechar</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

function spriteUrl(entryOrId){
  // accepts either an entry {slug} or a numeric dex id (looks up slug)
  // FIX: guard against invalid/missing ids so we never crash on `.slug` of undefined
  const entry = (typeof entryOrId === 'object' && entryOrId !== null) ? entryOrId : POKEMON[entryOrId];
  if(!entry || !entry.slug) return null;
  return `https://img.pokemondb.net/sprites/scarlet-violet/icon/${entry.slug}.png`;
}
function entryById(id){
  const p = POKEMON[id];
  if(!p) return null;
  return { id: Number(id), name: p.name, slug: p.slug };
}

  ["centiskorch-gigantamax","Gigantamax Centiskorch"],["hatterene-gigantamax","Gigantamax Hatterene"],["grimmsnarl-gigantamax","Gigantamax Grimmsnarl"],
  ["alcremie-gigantamax","Gigantamax Alcremie"],["copperajah-gigantamax","Gigantamax Copperajah"],["duraludon-gigantamax","Gigantamax Duraludon"],
  ["toxtricity-amped-gigantamax","Gigantamax Toxtricity"],["urshifu-single-strike-gigantamax","Gigantamax Urshifu (Ataque Único)"],
  ["urshifu-rapid-strike-gigantamax","Gigantamax Urshifu (Ataque Repetido)"]
].map(([slug,name]) => ({ slug, name, folders: ["home/normal/1x","sword-shield/normal"] }));

// Poké Bolas (slugs confirmados em pokemondb.net/item/all)
const POKEBALL_ITEMS = [
  ["poke-ball","Poké Bola"],["great-ball","Great Ball"],["ultra-ball","Ultra Ball"],["master-ball","Master Ball"],
  ["premier-ball","Premier Ball"],["heal-ball","Heal Ball"],["net-ball","Net Ball"],["nest-ball","Nest Ball"],
  ["dive-ball","Dive Ball"],["dusk-ball","Dusk Ball"],["timer-ball","Timer Ball"],["quick-ball","Quick Ball"],
  ["repeat-ball","Repeat Ball"],["luxury-ball","Luxury Ball"],["level-ball","Level Ball"],["lure-ball","Lure Ball"],
  ["moon-ball","Moon Ball"],["friend-ball","Friend Ball"],["love-ball","Love Ball"],["fast-ball","Fast Ball"],
  ["heavy-ball","Heavy Ball"],["safari-ball","Safari Ball"],["sport-ball","Sport Ball"],["park-ball","Park Ball"],
  ["dream-ball","Dream Ball"],["beast-ball","Beast Ball"],["cherish-ball","Cherish Ball"]
].map(([slug,name]) => ({ slug, name }));

// Tipos (só os 18 tipos reais — as 4 últimas entradas de TYPES são colunas extras da grade)
const TYPE_ITEMS = TYPES.slice(0, 18);

// Índice em CATEGORIES -> configuração de restrição. null = busca livre (categoria subjetiva, sem lista fechada).
const CATEGORY_CONFIG = [
  null,                                    // 0 Favorito 'daquele jeito'
  { kind:"species", slugs: REGIONAL_BIRD_SLUGS },      // 1 Favorito Pássaro Regional
  { kind:"species", slugs: REGIONAL_MAMMAL_SLUGS },    // 2 Favorito Mamífero Regional
  { kind:"species", slugs: REGIONAL_BUG_SLUGS },       // 3 Favorito Inseto Regional
  { kind:"mixed", slugs: GRASS_GIRL_SLUGS, items: GRASS_GIRL_EXTRA_ITEMS }, // 4 Favorita Grass Girl
  { kind:"species", slugs: PSEUDO_LEGENDARY_SLUGS },   // 5
  { kind:"species", slugs: FOSSIL_SLUGS },             // 6
  { kind:"species", slugs: PMD_HERO_SLUGS },           // 7 Favorito Herói Mystery Dungeon
  { kind:"species", slugs: BABY_SLUGS },               // 8
  { kind:"species", slugs: PMD_PERSONALITY_SLUGS },    // 9 O que eu seria no PMD
  { kind:"species", slugs: COVER_LEGEND_SLUGS },       // 10
  { kind:"species", slugs: MYTHICAL_SLUGS },           // 11
  { kind:"extra", items: MEGA_ITEMS },                 // 12
  { kind:"species", slugs: ULTRA_BEAST_SLUGS },        // 13
  { kind:"extra", items: GMAX_ITEMS },                 // 14
  { kind:"species", slugs: PARADOX_SLUGS },            // 15
  { kind:"species", slugs: REGIONAL_FORM_BASE_SLUGS }, // 16 (mostra a espécie-base; sprite específico de forma não disponível)
  { kind:"species", slugs: NEW_EVOLUTION_SLUGS },      // 17 Favorita Evolução Nova
  null,                                    // 18 Queria ter pego mais cedo
  { kind:"type", items: TYPE_ITEMS },                  // 19
  { kind:"ball", items: POKEBALL_ITEMS },              // 20
  { kind:"species", slugs: PIKACLONE_SLUGS },          // 21
  { kind:"species", slugs: EEVEELUTION_SLUGS },        // 22
  { kind:"extra", items: SPINDA_ITEMS },               // 23
  { kind:"extra", items: VIVILLON_ITEMS },             // 24
  { kind:"extra", items: FURFROU_ITEMS },              // 25
  { kind:"extra", items: ALCREMIE_ITEMS }              // 26
];

let board = {};

function slotEl(id, extraClass, tagText, range){
  const wrap = document.createElement("div");
  wrap.className = "slot-wrap";
  wrap.dataset.slotId = id;

  const btn = document.createElement("button");
  btn.className = "slot " + (extraClass||"");
  btn.addEventListener("click", () => openSearch(id, tagText, range));
  wrap.appendChild(btn);

  const label = document.createElement("span");
  label.className = "slot-label";
  wrap.appendChild(label);

  paintSlot(btn, id, label);
  return wrap;
}

function renderVisual(container, data, sizeVarName){
  container.innerHTML = "";
  if(!data) return;
  if(data.kind === "type"){
    const badge = document.createElement("span");
    badge.className = "type-chip";
    badge.style.background = data.color;
    badge.style.width = sizeVarName;
    badge.style.height = sizeVarName;
    badge.style.fontSize = `calc(${sizeVarName} * 0.26)`;
    badge.textContent = data.name.slice(0,3).toUpperCase();
    container.appendChild(badge);
    return;
  }
  if(data.kind === "species"){
    // FIX: se o id salvo não existir mais no dicionário POKEMON, não tenta montar
    // a URL do sprite (isso é o que causava o "Cannot read properties of undefined
    // (reading 'slug')") — simplesmente não desenha nada em vez de quebrar.
    const src = spriteUrl(data.dexId);
    if(!src) return;
    const img = document.createElement("img");
    img.alt = data.name || "";
    img.loading = "lazy";
    img.src = src;
    img.onerror = () => { img.onerror = null; img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${data.dexId}.png`; };
    container.appendChild(img);
    return;
  }
  // ball / extra
  const img = document.createElement("img");
  img.alt = data.name || "";
  img.loading = "lazy";
  if(data.kind === "ball"){
    img.src = `https://img.pokemondb.net/sprites/items/${data.slug}.png`;
  } else {
    const folders = data.folders && data.folders.length ? data.folders : ["home/normal/1x"];
    let fi = 0;
    const tryNext = () => {
      if(fi < folders.length){
        img.src = `https://img.pokemondb.net/sprites/${folders[fi]}/${data.slug}.png`;
        fi++;
      } else {
        img.onerror = null;
      }
    };
    img.onerror = tryNext;
    tryNext();
  }
  container.appendChild(img);
}

function paintSlot(btn, id, label){
  const data = board[id];
  btn.innerHTML = "";
  if(!label){
    const wrap = btn.closest(".slot-wrap");
    label = wrap ? wrap.querySelector(".slot-label") : null;
  }
  if(data){
    btn.classList.add("filled");
    renderVisual(btn, data, "var(--sprite-size)");
    const clearX = document.createElement("button");
    clearX.className = "clear-x";
    clearX.type = "button";
    clearX.textContent = "×";
    clearX.title = "Remover";
    clearX.addEventListener("click", (e) => {
      e.stopPropagation();
      delete board[id];
      saveBoard();
      paintSlot(btn, id, label);
      updateProgress();
    });
    btn.appendChild(clearX);
    if(label){
      label.textContent = data.name;
      label.title = data.name;
      label.classList.add("has-name");
    }
  } else {
    btn.classList.remove("filled");
    const ball = document.createElement("span");
    ball.className = "ball-icon";
    btn.appendChild(ball);
    if(label){
      label.textContent = "";
      label.removeAttribute("title");
      label.classList.remove("has-name");
    }
  }
}

function buildMainGrid(){
  const table = document.getElementById("mainGrid");
  table.innerHTML = "";
  const headRow = document.createElement("tr");
  const corner = document.createElement("th");
  corner.className = "corner-cell";
  headRow.appendChild(corner);
  TYPES.forEach(t => {
    const th = document.createElement("th");
    th.className = "type-head";
    th.textContent = t.n;
    th.style.background = t.c;
    headRow.appendChild(th);
  });
  table.appendChild(headRow);

  GENS.forEach((gen, gi) => {
    const row = document.createElement("tr");
    const rh = document.createElement("th");
    rh.className = "gen-head";
    rh.innerHTML = `${gen.label}<br><span style="color:var(--muted);font-size:var(--gen-sub-font);">${gen.sub}</span>`;
    row.appendChild(rh);
    TYPES.forEach((t, ti) => {
      const td = document.createElement("td");
      const slotId = `grid:${gi}:${ti}`;
      const range = { min: gen.min, max: gen.max };
      td.appendChild(slotEl(slotId, "", `${gen.label} · ${t.n}`, range));
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function buildCategories(){
  const area = document.getElementById("catArea");
  area.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "cat-grid";

  const teamCard = document.createElement("div");
  teamCard.className = "team-card";
  const teamTitle = document.createElement("h3");
  teamTitle.textContent = "Time";
  teamCard.appendChild(teamTitle);
  const teamRows = document.createElement("div");
  teamRows.className = "team-rows";
  for(let i=0;i<6;i++){
    teamRows.appendChild(slotEl(`team:${i}`, "", `Time #${i+1}`));
  }
  teamCard.appendChild(teamRows);
  grid.appendChild(teamCard);

  CATEGORIES.forEach((label, i) => {
    const card = document.createElement("div");
    card.className = "cat-card";
    const h3 = document.createElement("h3");
    h3.textContent = label;
    card.appendChild(h3);
    card.appendChild(slotEl(`cat:${i}`, "", label));
    grid.appendChild(card);
  });

  area.appendChild(grid);
}

let activeSlotId = null;
let activeRange = null;
let activeCategoryConfig = null;
const overlay = document.getElementById("overlay");
const searchInput = document.getElementById("searchInput");
const resultsList = document.getElementById("resultsList");
const overlayTitle = document.getElementById("overlayTitle");
const rangeNote = document.getElementById("rangeNote");

const KIND_WORD = { species:"Pokémon", type:"tipos", ball:"Poké Bolas", extra:"opções", mixed:"opções" };

function openSearch(slotId, label, range){
  activeSlotId = slotId;
  activeRange = (range && !(range.min===1 && range.max===1025)) ? range : null;

  activeCategoryConfig = null;
  const m = /^cat:(\d+)$/.exec(slotId);
  if(m){ activeCategoryConfig = CATEGORY_CONFIG[Number(m[1])] || null; }

  overlayTitle.textContent = label ? `Escolher para: ${label}` : "Escolher Pokémon";

  if(activeCategoryConfig){
    rangeNote.textContent = `Mostrando só as opções desta categoria (${CATEGORIES[Number(m[1])]})`;
  } else if(activeRange){
    rangeNote.textContent = `Mostrando só #${String(activeRange.min).padStart(3,'0')}–#${String(activeRange.max).padStart(3,'0')} dessa geração`;
  } else {
    rangeNote.textContent = "";
  }

  searchInput.value = "";
  renderResults("");
  overlay.style.display = "flex";
  setTimeout(() => searchInput.focus(), 30);
}
function closeSearch(){
  overlay.style.display = "none";
  activeSlotId = null;
  activeRange = null;
  activeCategoryConfig = null;
}
document.getElementById("closeOverlay").addEventListener("click", closeSearch);
overlay.addEventListener("click", (e) => { if(e.target === overlay) closeSearch(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeSearch(); });

const resultCountEl = document.getElementById("resultCount");

function getNormalizedPool(){
  if(!activeCategoryConfig){
    const pool = activeRange
      ? ALL_ENTRIES.filter(e => e.id >= activeRange.min && e.id <= activeRange.max)
      : ALL_ENTRIES;
    return pool.map(e => ({ kind:"species", id:e.id, slug:e.slug, name:e.name }));
  }
  if(activeCategoryConfig.kind === "species"){
    const set = new Set(activeCategoryConfig.slugs);
    return ALL_ENTRIES.filter(e => set.has(e.slug)).map(e => ({ kind:"species", id:e.id, slug:e.slug, name:e.name }));
  }
  if(activeCategoryConfig.kind === "type"){
    return activeCategoryConfig.items.map(t => ({ kind:"type", name:t.n, color:t.c }));
  }
  if(activeCategoryConfig.kind === "mixed"){
    const set = new Set(activeCategoryConfig.slugs || []);
    const speciesPart = ALL_ENTRIES.filter(e => set.has(e.slug)).map(e => ({ kind:"species", id:e.id, slug:e.slug, name:e.name }));
    const extraPart = (activeCategoryConfig.items || []).map(it => ({ kind:"extra", slug: it.slug, name: it.name, folders: it.folders }));
    return [...speciesPart, ...extraPart];
  }
  // ball / extra
  return activeCategoryConfig.items.map(it => ({ kind: activeCategoryConfig.kind, slug: it.slug, name: it.name, folders: it.folders }));
}

function renderResults(query){
  resultsList.innerHTML = "";
  const q = query.trim().toLowerCase();
  const pool = getNormalizedPool();
  const matches = q.length === 0 ? pool : pool.filter(e => e.name.toLowerCase().includes(q));
  const word = activeCategoryConfig ? KIND_WORD[activeCategoryConfig.kind] : "Pokémon";

  resultCountEl.textContent = q.length === 0
    ? `${matches.length} ${word}${activeRange ? " dessa geração" : ""} — role a lista ou digite pra filtrar`
    : `${matches.length} resultado${matches.length===1?"":"s"}`;

  if(matches.length === 0){
    const none = document.createElement("div");
    none.className = "no-results";
    none.textContent = "Nenhuma opção encontrada.";
    resultsList.appendChild(none);
    return;
  }

  const frag = document.createDocumentFragment();
  matches.forEach(m => {
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "result-tile";
    tile.title = m.name;
    renderVisual(tile, m, "var(--tile-sprite-size)");
    const name = document.createElement("span");
    name.className = "tname";
    name.textContent = m.name;
    tile.appendChild(name);
    if(m.kind === "species"){
      const dexno = document.createElement("span");
      dexno.className = "dexno";
      dexno.textContent = "#" + String(m.id).padStart(3,"0");
      tile.appendChild(dexno);
    }
    tile.addEventListener("click", () => selectEntry(m));
    frag.appendChild(tile);
  });
  resultsList.appendChild(frag);
}
searchInput.addEventListener("input", (e) => renderResults(e.target.value));

function selectEntry(entry){
  if(!activeSlotId) return;
  let record;
  if(entry.kind === "species"){
    record = { kind:"species", name: entry.name, dexId: entry.id };
  } else if(entry.kind === "type"){
    record = { kind:"type", name: entry.name, color: entry.color };
  } else {
    record = { kind: entry.kind, name: entry.name, slug: entry.slug, folders: entry.folders };
  }
  board[activeSlotId] = record;
  saveBoard();
  const wrap = document.querySelector(`.slot-wrap[data-slot-id="${CSS.escape(activeSlotId)}"]`);
  if(wrap){
    const btn = wrap.querySelector(".slot");
    const label = wrap.querySelector(".slot-label");
    paintSlot(btn, activeSlotId, label);
  }
  updateProgress();
  closeSearch();
}

const TOTAL_SLOTS = TYPES.length * GENS.length + 6 + CATEGORIES.length;
function updateProgress(){
  const filled = Object.keys(board).length;
  document.getElementById("progressPill").textContent = `${filled} / ${TOTAL_SLOTS} preenchidos`;
}

async function saveBoard(){
  try{
    await window.storage.set('pokemon-favorites-board', JSON.stringify(board), false);
  }catch(err){ console.error("Erro ao salvar:", err); }
}
async function loadBoard(){
  try{
    const res = await window.storage.get('pokemon-favorites-board', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      // FIX: saneia entradas corrompidas/antigas — se for uma entrada "species"
      // cujo dexId não existe (mais) em POKEMON, remove ela do board em vez de
      // deixar quebrar toda vez que a página carregar.
      Object.keys(parsed).forEach(k => {
        const d = parsed[k];
        if(!d || typeof d !== 'object'){
          delete parsed[k];
        } else if(d.kind === 'species' && !POKEMON[d.dexId]){
          delete parsed[k];
        }
      });
      board = parsed;
    }
  }catch(err){ board = {}; }
}

document.getElementById("resetBtn").addEventListener("click", async () => {
  if(!confirm("Tem certeza que quer limpar tudo?")) return;
  board = {};
  await saveBoard();
  buildMainGrid();
  buildCategories();
  updateProgress();
});

const sizeButtons = document.querySelectorAll('.size-btn');
function applySize(size, save){
  document.body.dataset.size = size;
  sizeButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === size)));
  if(save) saveSizePref(size);
}
sizeButtons.forEach(btn => {
  btn.addEventListener('click', () => applySize(btn.dataset.size, true));
});
async function saveSizePref(size){
  try{ await window.storage.set('pokemon-favorites-size', size, false); }catch(err){ /* ignore */ }
}
async function loadSizePref(){
  try{
    const res = await window.storage.get('pokemon-favorites-size', false);
    if(res && res.value){ applySize(res.value, false); }
  }catch(err){ /* default medium, no saved pref */ }
}

/* ---------- Exportar imagem (print do mural) ---------- */
async function exportBoardImage(){
  const btn = document.getElementById('exportBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Gerando...';
  btn.disabled = true;
  try{
    const target = document.querySelector('.wrap');
    const canvas = await html2canvas(target, {
      backgroundColor: '#1B1526',
      useCORS: true,
      scale: Math.min(2, window.devicePixelRatio || 1)
    });

    const scaleRatio = canvas.width / target.clientWidth;
    const footerH = Math.round(56 * scaleRatio);

    const final = document.createElement('canvas');
    final.width = canvas.width;
    final.height = canvas.height + footerH;
    const ctx = final.getContext('2d');

    ctx.fillStyle = '#1B1526';
    ctx.fillRect(0, 0, final.width, final.height);
    ctx.drawImage(canvas, 0, 0);

    ctx.fillStyle = '#241B33';
    ctx.fillRect(0, canvas.height, final.width, footerH);
    ctx.fillStyle = '#A99CC7';
    ctx.font = `${Math.round(13 * scaleRatio)}px 'Nunito', sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.fillText(
      'Sprites: PokémonDB (pokemondb.net) e PokéAPI  •  Mural por Clodsirez',
      Math.round(16 * scaleRatio),
      canvas.height + footerH / 2
    );

    final.toBlob((blob) => {
      if(!blob){
        alert('Não foi possível gerar a imagem, provavelmente por restrições de segurança (CORS) nas imagens dos Pokémon. Tente novamente — se persistir, use a captura de tela do navegador.');
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mural-pokemon-clodsirez.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  }catch(err){
    console.error('Erro ao gerar imagem:', err);
    alert('Não foi possível gerar a imagem, provavelmente por restrições de segurança (CORS) nas imagens dos Pokémon. Tente novamente — se persistir, use a captura de tela do navegador.');
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
}
document.getElementById('exportBtn').addEventListener('click', exportBoardImage);

(async function init(){
  await loadSizePref();
  await loadBoard();
  buildMainGrid();
  buildCategories();
  updateProgress();
})();
</script>
